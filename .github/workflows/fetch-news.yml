name: Obtener noticias de IA cada 24 horas

on:
  schedule:
    # Disparo principal: 05:23 AM UTC (01:23 AM hora Venezuela/Atlántico UTC-4).
    # Absorbe las 4 a 5 horas de demora habitual de la cola compartida de GitHub Actions,
    # garantizando que las noticias se publiquen entre las 05:30 y las 06:30 AM local (siempre antes de las 7:00 AM).
    # Se utiliza el minuto no estándar :23 para evitar las horas pico congestionadas (:00, :15, :30, :45).
    - cron: "23 5 * * *"
    # Disparo de contingencia anti-starvation: 08:37 AM UTC (04:37 AM hora Venezuela/Atlántico UTC-4).
    # Respaldo por si GitHub Actions omite o retrasa severamente el primer turno en días pico.
    - cron: "37 8 * * *"
  # Permite ejecutarlo manualmente desde GitHub cuando quieras
  workflow_dispatch:
    inputs:
      reenriquecer_fechas:
        description: "Fechas a re-enriquecer (YYYY-MM-DD separadas por coma). Vacío = corrida diaria normal."
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  fetch-news:
    if: github.event_name != 'workflow_dispatch' || inputs.reenriquecer_fechas == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: 1. Extraer y enriquecer noticias con IA
        run: node scripts/fetch-news.mjs --fetch-only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 2. Guardar noticias en el repositorio
        id: git_push
        run: |
          git config --local user.email "carlosfrei8899@gmail.com"
          git config --local user.name "Juan Carlos Ramos"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualización automática de noticias $(date +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios para guardar."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Verificar que la web esté desplegada en Vercel antes de emitir a Telegram
        if: steps.git_push.outputs.pushed == 'true'
        run: |
          echo "⏳ Esperando confirmación de despliegue en Vercel..."
          FECHA_HOY=$(date +'%Y-%m-%d')
          URL="https://diario-ia.vercel.app"
          
          # Esperar hasta 300 segundos (30 intentos cada 10s) para que Vercel termine de compilar la nueva edición
          DESPLEGADO=false
          for i in {1..30}; do
            sleep 10
            echo "Verificación #$i: Comprobando si $URL ya sirve la edición de $FECHA_HOY..."
            if curl -sL "$URL" | grep -q "$FECHA_HOY"; then
              echo "✅ ¡Vercel ha desplegado la edición $FECHA_HOY con éxito y la web está en vivo!"
              DESPLEGADO=true
              break
            fi
          done

          if [ "$DESPLEGADO" = false ]; then
            echo "⚠️ Vercel todavía no ha actualizado la web. Por seguridad, no se enviarán enlaces rotos a Telegram."
            exit 1
          fi

      - name: 4. Publicar noticias en canal de Telegram
        if: steps.git_push.outputs.pushed == 'true'
        run: node scripts/fetch-news.mjs --telegram-only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}

      - name: 5. Actualizar registro de noticias enviadas a Telegram en el repositorio
        if: steps.git_push.outputs.pushed == 'true'
        run: |
          git add data/telegram-enviados.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar registro de enviados a telegram $(date +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push
          fi

  reenriquecer-ediciones:
    if: github.event_name == 'workflow_dispatch' && inputs.reenriquecer_fechas != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Re-enriquecer ediciones pasadas con IA
        run: node scripts/fetch-news.mjs --reenriquecer "${{ inputs.reenriquecer_fechas }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "carlosfrei8899@gmail.com"
          git config --local user.name "Juan Carlos Ramos"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: re-enriquecimiento editorial ${{ inputs.reenriquecer_fechas }} ($(date +'%Y-%m-%d'))"
            git pull --rebase origin main || true
            git push
          else
            echo "Sin cambios para guardar."
          fi

