name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npx vitest run

      - name: Compilar aplicación Next.js 16 (Turbopack)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://diario-ia.vercel.app
